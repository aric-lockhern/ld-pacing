<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lockhern — Account Pacing</title>
<style>
:root{--bg:#F4F6F8;--surface:#FFFFFF;--ink:#17232E;--muted:#64717F;--faint:#93A0AD;--line:#E7EBEF;--line2:#EEF1F4;
--accent:#3A4FBF;--accent-bg:#EDEFFB;--good:#1B8A5A;--good-bg:#E7F4EE;--under:#B4791C;--under-bg:#FBF1DC;
--over:#C13B2E;--over-bg:#FBE9E6;--none:#AEB7C2;--editbg:#FFFDF3;--editline:#E4D9A8;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
.wrap{max-width:1180px;margin:0 auto;padding:22px 18px 40px;}
.t-good{color:var(--good);}.t-under{color:var(--under);}.t-over{color:var(--over);}.t-none{color:var(--none);}
.spin{animation:sp 1s linear infinite;}@keyframes sp{to{transform:rotate(360deg);}}

.topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px;}
.brand{display:flex;align-items:center;gap:9px;}
.mark{font-weight:700;font-size:18px;letter-spacing:-.02em;}.sep{color:var(--faint);}
.prod{font-size:18px;font-weight:500;color:var(--muted);letter-spacing:-.01em;}
.datachip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;border-radius:20px;padding:3px 10px;border:none;cursor:pointer;}
.datachip.live{color:var(--good);background:var(--good-bg);}
.datachip.sample{color:var(--under);background:var(--under-bg);}
.datachip.loading{color:var(--muted);background:var(--line2);cursor:default;}

.monthnav{display:flex;align-items:center;gap:6px;}
.mn-arrow{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border:1px solid var(--line);background:var(--surface);border-radius:8px;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;}
.mn-arrow:hover{border-color:#CDD5DE;color:var(--ink);}
.mn-label{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:650;min-width:158px;justify-content:center;}
.mn-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-radius:5px;padding:2px 6px;}
.mn-tag.live{color:var(--good);background:var(--good-bg);}.mn-tag.plan{color:var(--accent);background:var(--accent-bg);}
.mn-today{border:none;background:var(--accent-bg);color:var(--accent);border-radius:7px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;}

.banner{display:flex;align-items:center;gap:9px;border-radius:10px;padding:10px 14px;font-size:12.5px;margin-bottom:14px;line-height:1.4;}
.banner.warn{background:var(--under-bg);border:1px solid #EAD9A8;color:#7A5A12;}
.banner.plan{background:var(--accent-bg);border:1px solid #D9DEF6;color:#2A3670;}
.banner button{border:1px solid #d9cf9e;background:#fff;border-radius:7px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;margin-left:auto;}
.banner.plan button{border-color:#C7CEF0;color:var(--accent);}

.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.6fr);gap:12px;margin-bottom:16px;}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:13px 15px;}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:600;margin-bottom:6px;}
.stat-value{font-size:22px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.stat-pace{display:flex;flex-direction:column;}
.pace-row{display:flex;align-items:baseline;gap:10px;margin-bottom:9px;}
.pace-num{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;}
.pace-var{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;}
.pace-plan{display:flex;align-items:center;gap:7px;color:var(--accent);font-size:13px;font-weight:600;padding-top:6px;}

.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;position:relative;gap:12px;flex-wrap:wrap;}
.tcount{font-size:14px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.acctfilter{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 9px;}
.acctfilter:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg);}
.acctfilter .afic{font-size:12px;opacity:.7;}
.acctfilter input{border:none;outline:none;background:transparent;font-size:13px;font-weight:500;font-family:inherit;color:var(--ink);width:160px;}
.acctfilter .afclr{cursor:pointer;color:var(--faint);font-size:15px;line-height:1;border:none;background:none;padding:0 2px;}
.acctfilter .afclr:hover{color:var(--ink);}
.badge{display:inline-block;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:1px 9px;font-size:12px;font-variant-numeric:tabular-nums;}
.filtertag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-bg);border-radius:20px;padding:2px 9px;}
.tactions{display:flex;align-items:center;gap:9px;}
.dayctl{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);}
.dayin{width:38px;text-align:center;border:1px solid var(--line);border-radius:7px;padding:3px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--surface);}
.daypct{color:var(--faint);}
.saveind{font-size:12px;color:var(--faint);display:inline-flex;align-items:center;gap:4px;min-width:70px;justify-content:flex-end;}
.saveind.saved{color:var(--good);}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:9px;font-size:13px;font-weight:600;padding:7px 12px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);}
.btn:hover{border-color:#CDD5DE;}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent;}

.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.tscroll{overflow-x:auto;}
.grid{display:grid;grid-template-columns:30px 2.6fr .85fr .85fr 1.05fr 1.3fr .9fr 1fr .65fr .75fr .65fr 58px;align-items:center;gap:10px;padding:0 16px;min-width:1120px;}
.trendnote.burn{font-weight:700;}
.cell-trend{display:flex;flex-direction:column;align-items:flex-end;gap:1px;line-height:1.15;}
.trendval{font-weight:650;font-variant-numeric:tabular-nums;}
.trendnote{font-size:10px;font-weight:600;opacity:.9;white-space:nowrap;}
.t-none{color:var(--muted);}
.c-chev{display:flex;align-items:center;justify-content:flex-end;gap:6px;}
.rowmsg{border:1px solid var(--line);background:#fff;border-radius:6px;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);cursor:pointer;padding:0;}
.rowmsg:hover{border-color:var(--accent);color:var(--accent);}
.c-sel{display:flex;align-items:center;justify-content:center;}
.c-sel input{width:15px;height:15px;cursor:pointer;accent-color:var(--accent);}
.selbar{display:flex;align-items:center;gap:10px;background:var(--accent-bg);border:1px solid #D9DEF6;border-radius:10px;padding:9px 14px;margin-bottom:10px;}
.selcount{font-size:13px;font-weight:600;color:#2A3670;margin-right:2px;}
.btn.sm{padding:5px 10px;font-size:12px;}
.tag.hiddentag{color:var(--faint);background:var(--line2);}
.tag.disc{text-transform:capitalize;}
.tag.disc.strict{color:var(--over);background:var(--over-bg);}
.tag.disc.fluid{color:var(--muted);background:var(--line2);}
.typeseg{display:inline-flex;background:#EEF1F4;border-radius:8px;padding:2px;gap:2px;}
.typeseg button{border:none;background:none;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;}
.typeseg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(20,30,45,.12);}
.mgr-wrap{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--muted);}
.mgr-select{border:1px solid var(--line);border-radius:7px;padding:4px 6px;font-size:12px;font-family:inherit;color:var(--ink);background:#fff;max-width:130px;}
.modal-notify{font-size:12px;color:var(--accent);background:var(--accent-bg);border-radius:8px;padding:7px 10px;margin-bottom:8px;}
.notifs{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px 10px;margin-bottom:14px;}
.notif-head{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.notif-title{font-size:13px;font-weight:800;letter-spacing:-.01em;}
.notif-sub{font-size:12px;color:var(--muted);font-weight:600;}
.notif-toggle{margin-left:auto;}
.notif-list{display:flex;flex-direction:column;gap:5px;max-height:290px;overflow:auto;}
.notif-row{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:9px;cursor:pointer;border:1px solid transparent;}
.notif-row.critical{background:var(--over-bg);border-color:#F0D6D1;}
.notif-row.warning{background:var(--under-bg);border-color:#EFE0BE;}
.notif-row.positive{background:var(--good-bg);border-color:#CFE7D8;}
.notif-row:hover{filter:brightness(.985);}
.notif-ic{font-size:12px;flex-shrink:0;}
.notif-name{font-size:13px;font-weight:700;white-space:nowrap;flex-shrink:0;max-width:210px;overflow:hidden;text-overflow:ellipsis;}
.notif-txt{font-size:12.5px;color:#5A6472;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.notif-act{display:flex;gap:5px;flex-shrink:0;}
.notif-act .mini{padding:3px 8px;font-size:11px;background:rgba(255,255,255,.75);}
.modal-alert{font-size:12px;font-weight:600;border-radius:8px;padding:7px 10px;margin-bottom:8px;}
.modal-alert.critical{background:var(--over-bg);color:#8C2F25;}
.modal-alert.warning{background:var(--under-bg);color:#7A5A12;}
.modal-alert.positive{background:var(--good-bg);color:#166B47;}
.alertdot{color:var(--under);margin-right:5px;font-size:13px;cursor:help;}
.alertdot.crit{color:var(--over);font-weight:700;}
.updot{color:var(--good);margin-right:5px;font-size:11px;cursor:help;}
.filtertag.on{background:var(--accent);color:#fff;}
.filtertag.issues{color:var(--under);background:var(--under-bg);}
.filtertag.issues.on{background:var(--under);color:#fff;}
.filtertag.issues.hascrit{color:var(--over);background:var(--over-bg);}
.filtertag.issues.hascrit.on{background:var(--over);color:#fff;}
.filtertag.wins{color:var(--good);background:var(--good-bg);}
.filtertag.wins.on{background:var(--good);color:#fff;}
.alertstrip.critical{background:var(--over-bg);border-color:#E6C3BD;}
.alertstrip.critical .as-warn{color:var(--over);}
.alertstrip.growth{background:var(--good-bg);border-color:#C5E4CE;}
.as-grow{font-size:12px;font-weight:700;color:var(--good);}
.ed-actions{display:flex;align-items:center;gap:8px;}
.mini{border:1px solid var(--line);background:#fff;border-radius:7px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;}
.mini:hover{border-color:#CDD5DE;color:var(--ink);}
.alertstrip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--under-bg);border:1px solid #EAD9A8;border-radius:9px;padding:9px 13px;margin-bottom:12px;}
.alertstrip.dismissed{background:var(--line2);border-color:var(--line);}
.as-warn{font-size:12px;font-weight:700;color:var(--under);}
.as-txt{font-size:12.5px;color:#7A5A12;}
.alertstrip.dismissed .as-txt{color:var(--muted);}
.as-actions{margin-left:auto;display:flex;gap:8px;}
.setrow select{border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px;font-family:inherit;color:var(--ink);background:#fff;}
.setnote code{background:var(--line2);padding:1px 5px;border-radius:4px;font-size:11px;}
.modal-overlay{position:fixed;inset:0;background:rgba(20,30,45,.38);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:460px;padding:18px 20px 16px;box-shadow:0 18px 50px rgba(20,30,45,.28);}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.modal-title{font-size:15px;font-weight:700;}
.modal-x{border:none;background:none;font-size:22px;line-height:1;color:var(--faint);cursor:pointer;padding:0 2px;}
.modal-acc{font-size:16px;font-weight:650;letter-spacing:-.01em;}
.modal-stats{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin:3px 0 12px;}
.modal-note{width:100%;min-height:88px;resize:vertical;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14px;font-family:inherit;color:var(--ink);line-height:1.45;}
.modal-note:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg);}
.modal-from{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-family:inherit;color:var(--ink);}
.modal-from:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg);}
.modal-err{color:var(--over);font-size:12px;min-height:16px;margin-top:8px;}
.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:6px;}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:opacity .25s,transform .25s;z-index:120;box-shadow:0 8px 24px rgba(20,30,45,.3);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.topright{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.tabs{display:inline-flex;background:#EEF1F4;border-radius:9px;padding:3px;gap:2px;}
.tab{border:none;background:none;padding:6px 14px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(20,30,45,.1);}
.filtertag{border:none;cursor:pointer;}
.filtertag:hover{filter:brightness(.97);}
.settings{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 22px 20px;max-width:620px;}
.settings h3{margin:0 0 16px;font-size:16px;}
.setrow{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.setrow label{font-size:12px;font-weight:600;color:var(--muted);}
.setrow input{border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px;font-family:inherit;color:var(--ink);}
.setrow input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg);}
.setactions{display:flex;align-items:center;gap:12px;margin-top:4px;}
.setstate{font-size:12px;font-weight:600;color:var(--faint);}
.setstate.ok{color:var(--good);}
.setnote{font-size:12px;color:var(--faint);line-height:1.5;margin:16px 0 0;}
.head{height:38px;background:#FAFBFC;border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:600;}
.c-num{text-align:right;font-variant-numeric:tabular-nums;}
.c-budget{text-align:right;}
.head .c-budget{display:flex;justify-content:flex-end;align-items:center;gap:6px;}
.edithint{font-size:9px;font-weight:700;color:var(--under);background:var(--under-bg);border-radius:4px;padding:1px 4px;}
.c-chev{display:flex;justify-content:center;}
.head .sortable{cursor:pointer;user-select:none;}
.head .sortable:hover{color:var(--muted);}
.head .sort-active{color:var(--ink);}
.carried{font-size:12px;color:var(--accent);margin-right:4px;cursor:help;}
.budgetfield.inherited{border-style:dashed;border-color:var(--accent);}
.detail{margin-top:16px;}
.rangebar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.rangebar .rl{font-size:12px;font-weight:600;color:var(--muted);}
.segment.sm{padding:2px;}
.segment.sm button{padding:5px 12px;font-size:12px;}
.rangecount{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.chartcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 12px 8px;}
.ch-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;}
.legend{display:flex;gap:14px;justify-content:center;margin-top:4px;}
.lg{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);}
.lg i{width:14px;height:3px;border-radius:2px;display:inline-block;}
.chnote{text-align:center;font-size:11px;color:var(--faint);margin-top:5px;font-variant-numeric:tabular-nums;}
.bd-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;}
table.bd{width:100%;border-collapse:collapse;font-size:12.5px;min-width:640px;}
table.bd th{text-align:left;padding:8px 12px;background:#FAFBFC;color:var(--faint);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line);}
table.bd th.r,table.bd td.r{text-align:right;}
table.bd td{padding:7px 12px;border-bottom:1px solid var(--line2);font-variant-numeric:tabular-nums;}
table.bd tr:last-child td{border-bottom:none;}
@media(max-width:680px){.charts{grid-template-columns:1fr;}}
.rowblock{border-bottom:1px solid var(--line2);}.rowblock:last-child{border-bottom:none;}
.row{min-height:54px;cursor:pointer;font-size:14px;}
.row:hover{background:#FAFBFC;}
.c-name{display:flex;align-items:center;gap:7px;min-width:0;flex-wrap:wrap;row-gap:3px;padding:8px 0;}
.acc-name{font-weight:600;letter-spacing:-.01em;white-space:normal;overflow-wrap:anywhere;word-break:break-word;min-width:0;}
.acc-plats{display:inline-flex;gap:5px;align-items:center;flex-shrink:0;}
.tag{font-size:9.5px;font-weight:700;color:var(--muted);background:var(--line2);border-radius:4px;padding:1px 5px;white-space:nowrap;letter-spacing:.03em;}
.tag.flat{background:none;padding:1px 0;color:var(--faint);font-weight:600;letter-spacing:0;}
.c-num.strong{font-weight:650;}.c-num.neg{color:var(--over);}.c-num.pos{color:var(--good);}
.pacepct{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;display:inline-block;margin-bottom:4px;}
.trendbadge{font-size:9px;font-weight:700;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:top;}
.trendbadge.good{color:var(--good);background:var(--good-bg);}
.trendbadge.up{color:var(--accent);background:var(--accent-bg);}
.recentstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;}
.downote{font-size:11.5px;color:var(--muted);margin:-2px 0 10px;padding:0 2px;}
.downote b{color:var(--ink);font-weight:600;}
.runway{font-size:12.5px;border-radius:9px;padding:9px 13px;margin-bottom:12px;line-height:1.45;}
.runway.bad{background:var(--over-bg);border:1px solid #E6C3BD;color:#8C2F25;font-weight:600;}
.runway.ok{background:var(--good-bg);border:1px solid #C5E4CE;color:#166B47;}

.rp{display:flex;flex-direction:column;gap:2px;}
.rp-l{font-size:11px;color:var(--faint);font-weight:600;}
.rp-v{font-size:16px;font-weight:650;font-variant-numeric:tabular-nums;}
.rp-v.t-none{color:var(--ink);}
.rp-r{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;}
.pace-na{color:var(--faint);}
.chev{color:var(--faint);transition:transform .18s;display:inline-block;}
.rowblock.open .chev{transform:rotate(180deg);}

.budgetfield{display:inline-flex;align-items:center;justify-content:flex-end;background:var(--editbg);border:1px solid var(--editline);border-radius:8px;padding:0 4px 0 8px;max-width:118px;margin-left:auto;}
.budgetfield:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg);background:#fff;}
.bf-pre{color:var(--faint);font-size:13px;}
.bf-in{border:none;outline:none;background:transparent;text-align:right;width:78px;padding:6px 3px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);}
.lmbudget{display:inline-flex;align-items:center;gap:5px;margin-left:auto;background:none;border:1px dashed var(--line);border-radius:8px;padding:6px 9px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);cursor:pointer;}
.lmbudget:hover{border-color:var(--accent);}

<body>
<!-- Boot loader: shown immediately (before JS runs) so the page is never blank
     while the app initializes and the first data pull is in flight. Removed by
     hideBoot() once the initial load settles. Inline-styled on purpose. -->
<div id="boot" style="position:fixed;inset:0;background:#F4F6F8;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .35s ease;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <div class="spin" style="width:38px;height:38px;border:3px solid #E7EBEF;border-top-color:#3A4FBF;border-radius:50%;margin-bottom:16px;"></div>
  <div style="font-size:15px;font-weight:650;color:#17232E;letter-spacing:-.01em;">Lockhern — Account Pacing</div>
  <div style="font-size:12.5px;color:#64717F;margin-top:5px;">Loading your accounts… this can take a moment.</div>
</div>
<div class="wrap" id="app"></div>

<script>
/* ============================================================
   CONFIG — set these two, then host the file (see chat).
   ============================================================ */
function lsGet(k,d){ try{ var v=localStorage.getItem(k); return (v==null||v==='')?d:v; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function sortFromPref(){ var p=lsGet('lk_sort','name'); return p==='spend'?{key:'mtd',dir:'desc'}:(p==='issue'?{key:'issue',dir:'desc'}:{key:'name',dir:'asc'}); }
var DEFAULT_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbw3NZFjb0A3jN1OS3Kwu_1obkyy-8KU6lCAUXjawqFG66guzY3GU0hbC5A6RH3oQNLD/exec';
var DEFAULT_SECRET     = 'lockhern-pacing';                        // must match the gateway
var WEBAPP_URL = lsGet('lk_webapp', DEFAULT_WEBAPP_URL);
var SECRET     = lsGet('lk_secret', DEFAULT_SECRET);
var ACTIVE_LABEL = 'active';

/* ---- state ---- */
var state = {
  accounts: [], budgets: {}, open: {}, dailyByClient: {},
  rawG: [], rawM: [], rawDailyG: [], rawDailyM: [], groups: {}, hidden: {}, types: {}, managers: {}, discipline: {}, team: [], slackUsers: [], dismiss: {}, selected: {},
  changelog: null, changelogLoading: false,
  view: 'pacing', showAll: false, showHidden: false, filterIssues: false, filterWins: false, detailDays: 30, slackFor: null,
  filter: '', reminderDismissed: {},
  viewMonth: monthKey(new Date()),
  liveKey: monthKey(new Date()),
  elapsedOverride: loadElapsed(),
  source: 'loading', feedUpdated: '', save: 'idle',
  sort: sortFromPref()
};
var saveTimers = {};

/* ---- JSONP (works cross-origin, keeps the sheet private) ---- */
function jsonp(params, timeoutMs){
  return new Promise(function(resolve, reject){
    var cb = 'cb_' + Math.random().toString(36).slice(2);
    var script = document.createElement('script');
    var timer = setTimeout(function(){ cleanup(); reject(new Error('timeout')); }, timeoutMs||20000);
    function cleanup(){ clearTimeout(timer); try{ delete window[cb]; }catch(e){ window[cb]=undefined; } if(script.parentNode) script.parentNode.removeChild(script); }
    window[cb] = function(data){ cleanup(); resolve(data); };
    var q = Object.assign({}, params, { callback: cb, secret: SECRET });
    if((params.action||'').indexOf('set')===0) q.by = lsGet('lk_slackname','');   // stamp who made the change
    var qs = Object.keys(q).map(function(k){ return encodeURIComponent(k)+'='+encodeURIComponent(q[k]); }).join('&');
    script.src = WEBAPP_URL + '?' + qs;
    script.onerror = function(){ cleanup(); reject(new Error('network')); };
    document.body.appendChild(script);
  });
}

/* ---- boot loader (the full-screen splash before the first data lands) ---- */
function hideBoot(){ var el=document.getElementById('boot'); if(!el) return; el.style.opacity='0'; el.style.pointerEvents='none'; setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 380); }

/* ---- load ---- */
function loadData(){
  if(WEBAPP_URL.indexOf('http')!==0){ state.source='sample'; state.accounts=SAMPLE; render(); hideBoot(); return; }
  state.source='loading'; render();
  jsonp({ action:'data' }).then(function(res){
    if(!res || !res.ok) throw new Error(res && res.error || 'bad response');
    var feeds = res.feeds || {}, dl = res.dailies || {};
    state.rawG = feeds.Google_Feed||[]; state.rawM = feeds.Microsoft_Feed||[];
    state.rawDailyG = dl.Daily_Google||[]; state.rawDailyM = dl.Daily_Microsoft||[];
    state.groups = groupsToMap(res.groups||[]);
    state.team = teamToList(res.team||[]);
    state.dismiss = dismissToMap(res.dismissals||[]);
    state.budgets = budgetsToMap(res.budgets||[]);
    state.reminderDismissed={}; (res.remindersDismissed||[]).forEach(function(m){ if(m) state.reminderDismissed[m]=true; });
    rebuild();
    var stamps = state.accounts.map(function(a){return a.updated;}).filter(Boolean).sort();
    state.feedUpdated = stamps.length ? stamps[stamps.length-1] : '';
    state.source='live'; render(); hideBoot();
    if(!state._slackFetched){ state._slackFetched=true; jsonp({action:'slackUsers'}).then(function(r){ if(r&&r.ok&&r.users){ state.slackUsers=r.users; render(); } }).catch(function(){}); }
  }).catch(function(){
    state.accounts = SAMPLE; state.rawG=[]; state.rawM=[]; state.groups={}; state.dailyByClient={};
    state.source='sample'; render(); hideBoot();
  });
}

/* ---- transforms ---- */
function toNum(v){ var n=Number(String(v==null?'':v).replace(/[^0-9.\-]/g,'')); return isFinite(n)?n:0; }
function splitLabels(s){ return String(s||'').split(/[|,;]/).map(function(x){return x.trim();}).filter(Boolean); }

function effClient(row){ var id=String(row.AccountId||'').trim(); return (state.groups[id] || row.Client || row.Account || '').trim(); }
function idsFor(members,plat){ return members.filter(function(m){return m.platform===plat;}).map(function(m){return m.name;}).join(', '); }
function groupsToMap(rows){
  state.hidden={}; state.types={}; state.managers={}; state.discipline={};
  var out={};
  (rows||[]).forEach(function(r){
    var id=String(r.AccountId||'').trim(); if(!id) return;
    var g=String(r.Group||'').trim(); if(g) out[id]=g;
    if(String(r.Hidden||'').trim()==='1') state.hidden[id]=true;
    var t=String(r.Type||'').trim(); if(t==='ecomm'||t==='leadgen') state.types[id]=t;
    var mg=String(r.Manager||'').trim(); if(mg) state.managers[id]=mg;
    var dc=String(r.Discipline||'').trim().toLowerCase(); if(dc==='strict'||dc==='fluid') state.discipline[id]=dc;
  });
  return out;
}
function teamToList(rows){ return (rows||[]).map(function(r){ return {name:String(r.Name||'').trim(), id:String(r.SlackID||'').trim()}; }).filter(function(x){return x.name;}); }
function rosterList(){ return (state.slackUsers&&state.slackUsers.length)?state.slackUsers:state.team; }
function accountManager(a){ if(a.members) for(var i=0;i<a.members.length;i++){ var m=state.managers[a.members[i].accountId]; if(m) return m; } return ''; } // stored as "Name|id"
function mgrName(raw){ return raw?String(raw).split('|')[0]:''; }
function mgrId(raw){ if(!raw) return ''; var p=String(raw).split('|'); return p.length>1?p[1]:''; }
function setManagerClient(a, value){
  (a.members||[]).forEach(function(m){ if(value) state.managers[m.accountId]=value; else delete state.managers[m.accountId]; });
  render();
  if(state.source==='live') (a.members||[]).forEach(function(m){
    jsonp({action:'setManager',accountId:m.accountId,platform:m.platform,account:m.name,manager:value}).catch(function(){});
  });
}
function accountType(a){
  if(a.members) for(var i=0;i<a.members.length;i++){ var t=state.types[a.members[i].accountId]; if(t) return t; }
  return (a.g.val+a.m.val)>0 ? 'ecomm' : 'leadgen';  // auto-guess until set
}
function isEcomm(a){ return accountType(a)==='ecomm'; }
function setTypeClient(a, type){
  (a.members||[]).forEach(function(m){ state.types[m.accountId]=type; });
  render();
  if(state.source==='live'){
    state.save='saving'; updateSaveInd();
    var pending=(a.members||[]).length; if(!pending){ state.save='idle'; updateSaveInd(); return; }
    (a.members||[]).forEach(function(m){
      jsonp({action:'setType',accountId:m.accountId,platform:m.platform,account:m.name,type:type})
        .then(function(){ if(--pending<=0){ state.save='saved'; updateSaveInd(); setTimeout(function(){state.save='idle';updateSaveInd();},1200);} })
        .catch(function(){ if(--pending<=0){ state.save='idle'; updateSaveInd(); } });
    });
  }
}
// Budget discipline: 'strict' (hold to budget) or 'fluid' (over/under ok). Blank = unset.
function accountDiscipline(a){ if(a.members) for(var i=0;i<a.members.length;i++){ var d=state.discipline[a.members[i].accountId]; if(d) return d; } return ''; }
function setDisciplineClient(a, value){
  (a.members||[]).forEach(function(m){ if(value) state.discipline[m.accountId]=value; else delete state.discipline[m.accountId]; });
  render();
  if(state.source==='live'){
    state.save='saving'; updateSaveInd();
    var pending=(a.members||[]).length; if(!pending){ state.save='idle'; updateSaveInd(); return; }
    (a.members||[]).forEach(function(m){
      jsonp({action:'setDiscipline',accountId:m.accountId,platform:m.platform,account:m.name,discipline:value})
        .then(function(){ if(--pending<=0){ state.save='saved'; updateSaveInd(); setTimeout(function(){state.save='idle';updateSaveInd();},1200); } })
        .catch(function(){ if(--pending<=0){ state.save='idle'; updateSaveInd(); } });
    });
  }
}
function dismissToMap(rows){ var out={}; (rows||[]).forEach(function(r){ var c=String(r.Client||'').trim(), u=normDate(r.Until); if(c&&u) out[c]=u; }); return out; }
function rebuild(){ state.accounts=buildAccounts(state.rawG,state.rawM); state.dailyByClient=buildDaily(state.rawDailyG,state.rawDailyM);
  // Freshest completed data date across all accounts (today's partial excluded).
  // Spend-collapse windows end here so ordinary export lag never false-alarms.
  var mx='', ty=todayIso();
  for(var ck in state.dailyByClient){ if(!state.dailyByClient.hasOwnProperty(ck)) continue;
    var arr=state.dailyByClient[ck]; for(var i=0;i<arr.length;i++){ var ds=String(arr[i].date); if(ds<ty && ds>mx) mx=ds; } }
  state.searchMaxDate = mx || null;
  _dowCache={};   // day-of-week weights are recomputed against the fresh data
}
function accountByClient(cl){ for(var i=0;i<state.accounts.length;i++){ if(state.accounts[i].client===cl) return state.accounts[i]; } return null; }

function buildAccounts(g, m){
  var map = {};
  function ensure(c){ return map[c] || (map[c]={client:c,g:null,m:null,labelSet:{},updated:'',members:[],currency:''}); }
  function add(row, plat, platName){
    var client=effClient(row); if(!client) return;
    var id=String(row.AccountId||'').trim();
    var a=ensure(client);
    var b=a[plat]=a[plat]||{spend:0,conv:0,val:0,last:0};
    b.spend+=toNum(row.MTD_Spend); b.conv+=toNum(row.MTD_Conversions); b.val+=toNum(row.MTD_ConvValue); b.last+=toNum(row.LastMonth_Spend);
    a.members.push({accountId:id, platform:platName, name:row.Account||id});
    if(row.Currency) a.currency=row.Currency;
    splitLabels(row.Labels).forEach(function(l){ a.labelSet[l]=true; });
    if(row.Updated) a.updated=row.Updated;
  }
  g.forEach(function(r){ add(r,'g','Google'); }); m.forEach(function(r){ add(r,'m','Microsoft'); });
  return Object.keys(map).map(function(k){
    var a=map[k];
    return { client:a.client, hasG:!!a.g, hasM:!!a.m, labels:Object.keys(a.labelSet), currency:a.currency, updated:a.updated,
      members:a.members, grouped:a.members.length>1,
      hidden:a.members.some(function(mm){return !!state.hidden[mm.accountId];}),
      ids:{ g:idsFor(a.members,'Google'), m:idsFor(a.members,'Microsoft') },
      g:a.g||{spend:0,conv:0,val:0,last:0}, m:a.m||{spend:0,conv:0,val:0,last:0} };
  }).sort(function(x,y){ return x.client.localeCompare(y.client); });
}
function budgetsToMap(rows){
  var out={};
  rows.forEach(function(r){
    var month=normMonth(r.Month), client=String(r.Client||'').trim();
    if(!month||!client) return;
    (out[month]=out[month]||{})[client]={ mode:(String(r.Mode||'manual')==='lastMonth'?'lastMonth':'manual'), amount:toNum(r.Amount) };
  });
  return out;
}
function normMonth(v){
  if(v==null) return '';
  var s=String(v).trim();
  var m=s.match(/^(\d{4})-(\d{1,2})/);
  if(m) return m[1]+'-'+('0'+m[2]).slice(-2);
  var d=new Date(s);
  if(!isNaN(d.getTime())) return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2);
  return s;
}
function isActive(a){ return a.labels.some(function(l){ return l.toLowerCase()===ACTIVE_LABEL; }); }

/* ---- budgets (with carry-forward from the most recent prior month) ---- */
function getBudget(client){
  var ex = state.budgets[state.viewMonth] && state.budgets[state.viewMonth][client];
  if(ex) return { mode:ex.mode, amount:ex.amount, inherited:false };
  var k=state.viewMonth;
  for(var i=0;i<12;i++){
    k=shiftKey(k,-1);
    var b=state.budgets[k] && state.budgets[k][client];
    if(b) return { mode:b.mode, amount:b.amount, inherited:true, from:k };
  }
  return { mode:'manual', amount:0, inherited:false };
}
function inheritedInfo(list){
  var info={any:false,from:''};
  if(state.viewMonth!==state.liveKey) return info;
  list.forEach(function(a){ var b=getBudget(a.client); if(b.inherited){ info.any=true; info.from=b.from; } });
  return info;
}
function carryOverAll(){
  visibleAccounts().list.forEach(function(a){
    var b=getBudget(a.client);
    if(b.inherited) setBudget(a.client,{mode:b.mode,amount:b.amount});
  });
  render();
}

/* ---- sorting ---- */
function toggleSort(key){
  var s=state.sort;
  if(s.key===key) s.dir = s.dir==='asc' ? 'desc' : 'asc';
  else { s.key=key; s.dir = key==='name' ? 'asc' : 'desc'; } // numbers default high→low
}
function sortVal(a,key){
  if(key==='name') return a.client;
  var d=derive(a);
  if(key==='trend'){ var p=projection(a,d); return p?p.pct:null; }
  return { mtd:d.mtd, forecast:d.forecast, budget:d.effBudget, pace:d.pace,
           variance:d.variance, conv:d.conv, cpa:d.cpa, roas:d.roas }[key];
}
function sortAccounts(list){
  var s=state.sort; if(!s||!s.key) return list;
  if(s.key==='issue'){
    return list.slice().sort(function(a,b){
      var ra=alRank(a), rb=alRank(b);
      if(ra!==rb) return rb-ra;
      return derive(b).mtd - derive(a).mtd;
    });
  }
  return list.slice().sort(function(a,b){
    var va=sortVal(a,s.key), vb=sortVal(b,s.key);
    var na=(va==null||(typeof va==='number'&&!isFinite(va)));
    var nb=(vb==null||(typeof vb==='number'&&!isFinite(vb)));
    if(na&&nb) return a.client.localeCompare(b.client);
    if(na) return 1; if(nb) return -1;            // blanks always sink to the bottom
    var cmp = typeof va==='string' ? va.toLowerCase().localeCompare(vb.toLowerCase()) : va-vb;
    return s.dir==='asc' ? cmp : -cmp;
  });
}
function th(label,key,cls){

/* ---- month / derive ---- */
function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function parseKey(k){ var p=k.split('-'); return {y:+p[0],m:+p[1]-1}; }
function monthLabel(k){ var o=parseKey(k); return new Date(o.y,o.m,1).toLocaleString('en-US',{month:'long',year:'numeric'}); }
function daysInMonthOf(k){ var o=parseKey(k); return new Date(o.y,o.m+1,0).getDate(); }
function shiftKey(k,d){ var o=parseKey(k); return monthKey(new Date(o.y,o.m+d,1)); }

function ctx(){
  var isLive = state.viewMonth===state.liveKey;
  var dim = daysInMonthOf(state.viewMonth);
  var auto = Math.max(1, new Date().getDate()-1);
  var elapsed = state.elapsedOverride!=null ? Math.max(1,Math.min(state.elapsedOverride,dim)) : auto;
  return { isLive:isLive, dim:dim, auto:auto, elapsed:elapsed };
}

/* ============================================================
   DAY-OF-WEEK WEIGHTING (empirical)
   The flat "budget ÷ days" ramp assumes every weekday spends the same, so any
   account with a weekend collapse (or any DOW skew) throws false over/under
   pace — most visibly a weekday burn rate extrapolated flat across a weekend
   tail. This learns each weekday's share from trailing spend and uses it to
   (a) shape the Expected curve and (b) project the remaining days.
   NOTE: sheet-fed tool — no ad schedule, so weights are OBSERVED, not
   scheduled. We can tell "this weekday reliably barely spends" from the data;
   we can NOT tell "scheduled to serve but delivered nothing" (that needs the
   Google Ads ad-schedule feed). Confidence is gated + old linear kept as a
   secondary field, so a thin/odd history falls back to today's behavior.  */
// DOW_LOOKBACK = window for learning the day-of-week SHAPE (stable); DOW_BASE_DAYS
// = window for the recent spend LEVEL that drives "trending to". The level window
// is kept short so the projection follows a recent budget change / correction
// instead of lagging a week behind it.
var DOW_LOOKBACK=28, DOW_BASE_DAYS=7, DOW_CLAMP=3.0, DOW_MIN_OBS=2, DOW_MAD_K=3, DOW_CEIL_MULT=1.10, DOW_ACTIVE_FLOOR=5;
function dowIdx(iso){ return new Date(iso+'T00:00:00').getDay(); }      // 0=Sun..6=Sat
function _median(a){ if(!a.length) return 0; var s=a.slice().sort(function(x,y){return x-y;}); var m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2; }
var _dowCache={};
function dowModel(client){
  var key=client+'|'+state.searchMaxDate+'|'+state.viewMonth;
  if(_dowCache[key]) return _dowCache[key];
  var m=_dowBuild(client); _dowCache[key]=m; return m;
}
var _DOW_FLAT={weights:[1,1,1,1,1,1,1], baseline:null, confidence:'LOW', source:'FLAT', excluded:[], obs:[0,0,0,0,0,0,0], ceiling:null};
function _dowBuild(client){
  var all=accountDaily(client).filter(function(p){ return String(p.date)<todayIso(); });
  if(all.length<7) return _DOW_FLAT;
  var end=all[all.length-1].date, start=isoAdd(end,-(DOW_LOOKBACK-1));
  var win=all.filter(function(p){ return String(p.date)>=start; });
  if(win.length<7) return _DOW_FLAT;
  // group the lookback by weekday
  var byDow=[[],[],[],[],[],[],[]];
  win.forEach(function(p){ byDow[dowIdx(p.date)].push(p); });
  // Per-weekday contamination drop: a day whose spend is a MAD outlier vs that
  // weekday's own median (a normally-busy weekday that went dark = paused / out
  // of budget / disapproved), or zero impressions on a weekday that normally
  // serves. A reliably-quiet weekday (real weekend collapse) is NOT dropped —
  // its low spend IS the signal we want to learn.
  var excluded=[], clean=[[],[],[],[],[],[],[]];
  for(var dw=0; dw<7; dw++){
    var rows=byDow[dw], sp=rows.map(function(p){return p.spend||0;});
    var med=_median(sp), dev=sp.map(function(v){return Math.abs(v-med);}), mad=_median(dev);
    rows.forEach(function(p){
      var s=p.spend||0;
      // Drop only genuine anomalies, never a day that simply spent LESS: an
      // implausibly HIGH spike (tracking glitch), or a zero-delivery day (paused /
      // out of budget) on a weekday that normally serves. A sustained lower level
      // is a real budget change / correction and MUST be kept — otherwise the
      // baseline stays anchored to the old spend and the forecast never catches up.
      if(mad>0 && s-med > DOW_MAD_K*1.4826*mad){ excluded.push({date:p.date,reason:'spike_outlier'}); return; }
      if((p.impr||0)===0 && med>DOW_ACTIVE_FLOOR){ excluded.push({date:p.date,reason:'zero_delivery_day'}); return; }
      clean[dw].push(s);
    });
  }
  var pool=[]; clean.forEach(function(a){ a.forEach(function(v){ pool.push(v); }); });
  if(!pool.length) return _DOW_FLAT;
  var meanAll=pool.reduce(function(s,v){return s+v;},0)/pool.length;
  if(!(meanAll>0)) return _DOW_FLAT;
  var obs=clean.map(function(a){return a.length;});
  var weights=[], filled=false;
  for(var d2=0; d2<7; d2++){
    if(!clean[d2].length){ weights.push(1); filled=true; continue; }         // unknown weekday → neutral (flags LOW)
    var mu=clean[d2].reduce(function(s,v){return s+v;},0)/clean[d2].length;
    weights.push(Math.max(0, Math.min(DOW_CLAMP, mu/meanAll)));
  }
  var sum=weights.reduce(function(s,v){return s+v;},0);
  if(!(sum>0)) return _DOW_FLAT;
  var k=7/sum; weights=weights.map(function(v){return v*k;});               // normalize so Σweights == 7
  // thin/odd history → LOW confidence; callers fall back to flat (= status quo)
  var thin = filled || obs.some(function(n){ return n>0 && n<DOW_MIN_OBS; }) || obs.filter(function(n){return n>0;}).length<5;
  // Level estimate: weight-normalized mean of the trailing clean days, so it
  // isn't skewed by which weekdays happen to fall in the window.
  var bstart=isoAdd(end,-(DOW_BASE_DAYS-1)), exSet={}; excluded.forEach(function(e){ exSet[e.date]=1; });
  // Level = Σspend / Σweight over the trailing clean days (NOT the mean of
  // spend/weight). A weighted average reproduces the window's real total exactly
  // and is day-of-week neutral; mean-of-ratios divides a low-weight weekend's
  // spend by ~0.1 and averages that huge number in equally, biasing the baseline
  // (and therefore the whole forecast) far too high for weekday-heavy accounts.
  var sumSpend=0, sumW=0, recentMax=0;
  all.forEach(function(p){ if(String(p.date)<bstart) return; if(exSet[p.date]) return;
    var w=weights[dowIdx(p.date)]; if(w>0.05){ sumSpend+=(p.spend||0); sumW+=w; }
    if((p.spend||0)>recentMax) recentMax=p.spend; });
  var baseline = sumW>0 ? sumSpend/sumW : meanAll;
  // Delivery-ceiling proxy: we lack the sum of enabled daily budgets, so cap any
  // single projected day at the recent peak actual daily spend ×1.10 — keeps a
  // delivery-limited account from over-forecasting. (True ceiling needs budgets.)
  var ceiling = recentMax>0 ? recentMax*DOW_CEIL_MULT : null;
  return { weights:weights, baseline:baseline, confidence:(thin?'LOW':'HIGH'), source:'OBSERVED', excluded:excluded, obs:obs, ceiling:ceiling };
}
// Weighted forecast of the calendar month's remaining days. Returns null when
// the model isn't confident (caller falls back to the flat projection).
function dowProject(client, mtd){
  var c=ctx(); if(!c.isLive) return null;
  var m=dowModel(client);
  if(m.confidence==='LOW' || m.baseline==null) return null;
  var fc=[], add=0;
  for(var day=c.elapsed+1; day<=c.dim; day++){
    var iso=state.viewMonth+'-'+('0'+day).slice(-2), w=m.weights[dowIdx(iso)], f=w*m.baseline;
    if(m.ceiling!=null && f>m.ceiling) f=m.ceiling;
    add+=f; fc.push({date:iso, dow:dowIdx(iso), f:f});
  }
  return { proj:mtd+add, add:add, fc:fc, baseline:m.baseline, weights:m.weights, confidence:m.confidence, ceiling:m.ceiling, excluded:m.excluded, model:m };
}
// DOW-weighted expected cumulative $ for a given month/budget: budget × (Σ
// weight over elapsed days)/(Σ weight over all days). Falls back to flat linear.
function dowExpected(client, monthKey, budget){
  var m=dowModel(client), dim=daysInMonthOf(monthKey), cum=[0], ws=0, flat=(m.confidence==='LOW');
  for(var day=1; day<=dim; day++){ var iso=monthKey+'-'+('0'+day).slice(-2); ws+=(flat?1:m.weights[dowIdx(iso)]); cum[day]=ws; }
  return { at:function(n){ n=Math.max(0,Math.min(dim,n)); return ws>0?budget*(cum[n]/ws):0; }, source:(flat?'FLAT':'DOW'), model:m };
}
var DOW_NAMES=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function remainingDowLabel(){
  var c=ctx(); if(!c.isLive) return '';
  var out=[]; for(var day=c.elapsed+1; day<=c.dim; day++){ var iso=state.viewMonth+'-'+('0'+day).slice(-2); out.push(DOW_NAMES[dowIdx(iso)]); }
  return out.length ? (out.length+' remaining: '+out.join(', ')) : '';
}

function derive(acc){
  var c=ctx();
  var mtd=acc.g.spend+acc.m.spend, lastMoTotal=acc.g.last+acc.m.last, conv=acc.g.conv+acc.m.conv, val=acc.g.val+acc.m.val;
  var forecastLinear = c.isLive && c.elapsed>0 ? (mtd/c.elapsed)*c.dim : null;   // flat whole-month average (secondary)
  var dp = c.isLive ? dowProject(acc.client, mtd) : null;                        // day-of-week weighted (primary when confident)
  var forecast = dp ? dp.proj : forecastLinear;
  var b=getBudget(acc.client);
  var effBudget = b.mode==='lastMonth' ? lastMoTotal : b.amount;
  var pace = effBudget>0 && forecast!=null ? forecast/effBudget : null;
  var variance = forecast!=null ? forecast-effBudget : null;
  var cpa = conv>0 ? mtd/conv : null;
  var roas = val>0 && mtd>0 ? val/mtd : null;
  return { mtd:mtd,lastMoTotal:lastMoTotal,conv:conv,val:val,forecast:forecast,forecastLinear:forecastLinear,dow:dp,effBudget:effBudget,pace:pace,variance:variance,cpa:cpa,roas:roas,budget:b };
}

/* ---- "trending to": project month-end from the RECENT daily rate ----
   Forecast averages the whole month, so an early over/underspend keeps
   skewing it. This instead asks: at the rate we're spending NOW, where do
   we land? = spent so far + (recent daily avg × days left).            */
var RATE_DAYS=3;
function projection(a,d){
  var c=ctx();
  if(!c.isLive) return null;
  var daily=accountDaily(a.client).filter(function(p){ return String(p.date)<todayIso(); });
  if(!daily.length) return null;
  var spent=0;
  daily.forEach(function(p){ if(String(p.date).slice(0,7)===state.viewMonth) spent+=p.spend; });
  var daysLeft=Math.max(0, c.dim-c.elapsed);
  // Day-of-week weighted projection of the remaining days when we have a
  // confident model (a weekday burn rate no longer gets extrapolated flat
  // across a weekend tail); otherwise the flat recent-rate × days-left.
  var dp = d.dow || dowProject(a.client, spent);
  var rate, proj, weighted=false;
  if(dp){ rate=dp.baseline; proj=spent+dp.add; weighted=true; }
  else { var recent=daily.slice(-RATE_DAYS), rr=0; recent.forEach(function(p){ rr+=p.spend; }); rate=recent.length?rr/recent.length:0; proj=spent+rate*daysLeft; }
  var pct = d.effBudget>0 ? proj/d.effBudget : null;
  return { proj:proj, rate:rate, daysLeft:daysLeft, spent:spent, pct:pct, weighted:weighted,
           gap:(d.effBudget>0 ? proj-d.effBudget : null), days:(dp?DOW_BASE_DAYS:RATE_DAYS) };
}
function trendCell(a,d,isLive,extraCls){
  var cls='c-num cell-trend'+(extraCls||'');
  var p = isLive ? projection(a,d) : null;
  if(!p) return '<div class="'+cls+'">—</div>';
  var b = isLive ? burnInfo(a,d) : null;
  var st = b ? 'over' : statusOf(p.pct);
  var note = b ? b.tag
    : (p.pct==null ? 'no budget'
      : (st==='good' ? 'on track'
      : (p.gap>0 ? '+'+money(p.gap,true)+' over' : money(Math.abs(p.gap),true)+' under')));
  var tip = b ? (b.text + ' · trending to ' + money(p.proj,true))
    : (p.weighted
        ? ('Weekday-weighted: '+money(p.spent,true)+' spent + '+money(p.proj-p.spent,true)+' projected across the '+p.daysLeft+' remaining days (~'+money(p.rate)+'/weekday level, weekends scaled down)')
        : ('At the recent rate: '+money(p.spent,true)+' spent + '+money(p.rate)+'/day (last '+p.days+' days) × '+p.daysLeft+' days left'));
  return '<div class="'+cls+'" title="'+esc(tip)+'"><span class="trendval t-'+st+'">'+money(p.proj,true)+'</span>'
       + '<span class="trendnote t-'+st+(b?' burn':'')+'">'+esc(note)+'</span></div>';
}

/* ---- format ---- */
function money(n,c){ if(n==null||!isFinite(n))return '—'; var a=Math.abs(n); if(c&&a>=1000){ return a>=1e6?'$'+(n/1e6).toFixed(1)+'M':'$'+(n/1000).toFixed(1)+'k'; } return '$'+Math.round(n).toLocaleString(); }
function pct(x){ return x==null||!isFinite(x)?'—':Math.round(x*100)+'%'; }
function xfmt(x){ return x==null||!isFinite(x)?'—':x.toFixed(2)+'x'; }
function intf(x){ return x==null||!isFinite(x)?'—':Math.round(x).toLocaleString(); }
function fmtInt(n){ return Math.round(Number(n)||0).toLocaleString('en-US'); }
function statusOf(p){ if(p==null)return 'none'; if(p<0.9)return 'under'; if(p>1.1)return 'over'; return 'good'; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch];}); }

  var list=state.accounts.filter(function(a){

    if(anyLabels && !state.showAll && !isActive(a)) return false;
    return true;
  });
  var q=(state.filter||'').trim().toLowerCase();
  if(q) list=list.filter(function(a){ return a.client.toLowerCase().indexOf(q)>=0; });
  if(state.filterIssues) list=list.filter(function(a){ return alertFor(a).flagged; });
  if(state.filterWins) list=list.filter(function(a){ return alertFor(a).positive; });
  return { list:list, anyLabels:anyLabels };
}
function totals(list){
  var t={mtd:0,forecast:0,budget:0,conv:0,val:0,proj:0}, isLive=state.viewMonth===state.liveKey;
  list.forEach(function(a){
    var d=derive(a); t.mtd+=d.mtd; t.forecast+=d.forecast||0; t.budget+=d.effBudget||0; t.conv+=d.conv; t.val+=d.val;
    var p=projection(a,d); t.proj += p ? p.proj : (d.forecast||0);
  });
  t.pace = isLive&&t.budget>0 ? t.forecast/t.budget : null;
  t.projPct = isLive&&t.budget>0 ? t.proj/t.budget : null;
  t.projGap = isLive&&t.budget>0 ? t.proj-t.budget : null;
  t.variance = isLive ? t.forecast-t.budget : null;
  t.cpa = t.conv>0 ? t.mtd/t.conv : null;
  t.roas = t.val>0&&t.mtd>0 ? t.val/t.mtd : null;
  return t;
}

function notifHTML(){

}

function changelogHTML(){

  var head='<h3 style="margin-top:26px">Change log <button class="btn sm" data-act="changelog-refresh" style="margin-left:8px;font-weight:600">↻ Refresh</button></h3>';

  if(!state.changelog.length) return head+'<p class="setnote">No changes logged yet.'+whoNote+'</p>';
  var rows=state.changelog.map(function(e){
    var when=String(e.When||'').replace('T',' ').slice(0,16);

    return '<tr><td>'+esc(when)+'</td><td>'+esc(by)+'</td><td>'+esc(String(e.Area||''))+'</td><td>'+esc(String(e.Action||''))+'</td><td>'+esc(String(e.Target||''))+'</td><td>'+esc(String(e.Detail||''))+'</td></tr>';

function loadChangelog(){
  if(WEBAPP_URL.indexOf('http')!==0){ state.changelog=[]; if(state.view==='settings') render(); return; }
  state.changelogLoading=true; if(state.view==='settings') render();
  jsonp({action:'changelog'}).then(function(r){
    state.changelogLoading=false;
    state.changelog=(r&&r.ok&&r.entries)?r.entries:[];
    if(state.view==='settings') render();

function closeSlack(){ state.slackFor=null; render(); }
function sendSlack(){
  var a=accountByClient(state.slackFor); if(!a) return;
  var noteEl=document.getElementById('slack-note'), fromEl=document.getElementById('slack-from');
  var note=(noteEl&&noteEl.value.trim())||'', from=(fromEl&&fromEl.value.trim())||'';
  if(!note){ if(noteEl) noteEl.focus(); return; }
  if(from) lsSet('lk_slackname', from);
  var d=derive(a);
  var stats='MTD '+money(d.mtd,true)+' · Forecast '+money(d.forecast,true)+' · Budget '+money(d.effBudget,true)+' · Pace '+pct(d.pace)+' · CPA '+(d.cpa==null?'—':money(d.cpa))+(isEcomm(a)?(' · ROAS '+xfmt(d.roas)):'');
  var text='*'+a.client+'* — pacing note\n> '+note+'\n'+stats+(from?('\n_— '+from+'_'):'');
  var mraw=accountManager(a), mid=mgrId(mraw);
  if(mid) text='<@'+mid+'> '+text;
  else if(mraw) text='(cc '+mgrName(mraw)+') '+text;
  var btn=document.getElementById('slack-send'), err=document.getElementById('slack-err');
  if(btn){ btn.disabled=true; btn.textContent='Sending…'; } if(err) err.textContent='';
  jsonp({action:'postSlack', text:text}).then(function(r){
    if(r&&r.ok){ closeSlack(); toast('Sent to #pacing'); }
    else {
      if(btn){btn.disabled=false;btn.textContent='Send to #pacing';}
      var reason=(r&&r.error)?r.error:((r&&r.code)?('Slack '+r.code+(r.body?(' '+r.body):'')):'redeploy the gateway as a new version');
      if(err) err.textContent='Couldn’t send — '+reason;
    }
  }).catch(function(){ if(btn){btn.disabled=false;btn.textContent='Send to #pacing';} if(err) err.textContent='Couldn’t reach the gateway.'; });
}
function toast(msg){ var t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(function(){t.classList.add('show');},10); setTimeout(function(){t.classList.remove('show'); setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); },300);},2200); }

function normDate(v){
  if(v==null) return '';
  var s=String(v).trim();
  var m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return m[1]+'-'+m[2]+'-'+m[3];
  var d=new Date(s);
  if(!isNaN(d.getTime())) return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
  return s;
}
function buildDaily(gRows,mRows){
  var map={};
  function add(row){
    var client=effClient(row), date=normDate(row.Date);
    if(!client||!date) return;
    var c=map[client]=map[client]||{};
    var d=c[date]=c[date]||{date:date,spend:0,conv:0,clicks:0,impr:0,rev:0};
    d.spend+=toNum(row.Spend); d.conv+=toNum(row.Leads); d.clicks+=toNum(row.Clicks); d.impr+=toNum(row.Impressions); d.rev+=toNum(row.Revenue);
  }
  (gRows||[]).forEach(add); (mRows||[]).forEach(add);
  var out={};
  Object.keys(map).forEach(function(cl){ out[cl]=Object.keys(map[cl]).map(function(k){return map[cl][k];}).sort(function(a,b){return a.date<b.date?-1:(a.date>b.date?1:0);}); });
  return out;
}

/* ---- alerts (WoW drop on spend / conversions / revenue, through yesterday) ---- */
/* Detection: compares recent windows against the same window over prior weeks,
   z-scored so volatile/low-volume accounts don't false-alarm. Uses multi-day
   windows (not a single day) so one noisy or still-reporting day can't trip it. */
var ALERT_WEEKS=6;             // prior weeks to compare against
var Z_WARN=2.0, Z_CRIT=3.0;   // std-devs off for warning / critical
var PCT_WARN=0.35, PCT_CRIT=0.55;
var METRICS=[
  {k:'spend',label:'Spend',   minDay:75, critDay:250},  // spend only ever fires critical (pullbacks are usually intentional)
  {k:'conv', label:'Conv.',   minDay:4,  critDay:10},
  {k:'rev',  label:'Revenue', minDay:150,critDay:600}
];
function todayIso(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function stats(arr){ var n=arr.length; if(!n) return {mu:0,sd:0}; var mu=0; arr.forEach(function(v){mu+=v;}); mu/=n; var v=0; arr.forEach(function(x){v+=(x-mu)*(x-mu);}); return {mu:mu,sd:Math.sqrt(v/(n>1?(n-1):1))}; }
function isoAdd(iso,delta){ var d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+delta); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
// recent L-day sum vs the same L-day window in each of the prior weeks (day-of-week neutral, z-scored)
function windowSignal(map, dates, key, L){
  if(dates.length<L) return null;
  var endIso=dates[dates.length-1], minIso=dates[0];
  function wsum(endD){ var s=0; for(var i=0;i<L;i++){ var r=map[isoAdd(endD,-i)]; s+=r?(r[key]||0):0; } return s; }
  var recent=wsum(endIso), priors=[];
  for(var w=1;w<=ALERT_WEEKS;w++){ var pe=isoAdd(endIso,-7*w); if(isoAdd(pe,-(L-1))>=minIso) priors.push(wsum(pe)); }
  if(priors.length<3) return null;
  var st=stats(priors), sd=Math.max(st.sd, st.mu*0.12);
  return {recent:recent, mu:st.mu, z:sd>0?(recent-st.mu)/sd:0, pct:st.mu>0?(recent-st.mu)/st.mu:0};
}
/* ---- recent trend: has spend been corrected in the last few days? ---- */
function recentPace(a, d){
  var out={ok:false};
  var c=ctx();
  var target = d.effBudget>0 ? d.effBudget/c.dim : 0;
  if(!target) return out;
  var raw=accountDaily(a.client).filter(function(p){ return String(p.date)<todayIso(); });
  if(!raw.length) return out;
  // Calendar-fill through the freshest completed day across the portfolio, so a
  // day the account spent $0 (no feed row) counts as $0 — not as "no data". This
  // is why "yesterday" and the recent averages reflect real calendar days.
  var _m={}; raw.forEach(function(p){ _m[String(p.date)]=p; });
  var _end=raw[raw.length-1].date; if(state.searchMaxDate && state.searchMaxDate>_end) _end=state.searchMaxDate;
  var daily=[], _it=raw[0].date;
  while(_it<=_end){ daily.push(_m[_it]||{date:_it,spend:0}); _it=isoAdd(_it,1); }
  function avg(k){ var s=daily.slice(-k); if(!s.length) return null; var t=0; s.forEach(function(r){t+=(r.spend||0);}); return t/s.length; }
  out.ok=true; out.target=target;
  out.yesterday=daily[daily.length-1].spend||0;
  out.yDate=daily[daily.length-1].date;
  out.avg3=avg(3); out.avg7=avg(7);
  out.days=daily.length;
  out.ratio3=out.avg3!=null?out.avg3/target:null;   // vs flat target (drives the corrected/ramped badge)
  out.ratioY=out.yesterday/target;
  /* What's actually left, and what we can spend per day from here to land on
     budget. Once you're mid-month and off-pace, THIS is the real target —
     budget ÷ days-in-month stops being meaningful. */
  out.budget = d.effBudget;
  out.spent = d.mtd;
  out.remaining = d.effBudget - d.mtd;
  out.daysLeft = Math.max(0, c.dim - c.elapsed);
  out.allowed = out.daysLeft>0 ? Math.max(0,out.remaining)/out.daysLeft : null;
  out.rate = (out.avg3!=null) ? out.avg3 : out.yesterday;   // current burn rate
  out.runoutDays = (out.remaining>0 && out.rate>0) ? out.remaining/out.rate : null;
  return out;
}

/* Small readout: how the projection treats the days LEFT. Shows the weekday

/* "At this burn rate the money runs out on <date>" — skipped when the alert
   strip above is already saying it, so the panel doesn't repeat itself. */
function runwayHTML(r, shownAbove){

  if(shownAbove) return '';

    return '<div class="runway bad">\ud83d\udea8 Budget is already spent \u2014 '+money(Math.abs(r.remaining))
      + ' over with '+r.daysLeft+' day'+(r.daysLeft===1?'':'s')+' still to go.</div>';
  }

    var iso=out.getFullYear()+'-'+('0'+(out.getMonth()+1)).slice(-2)+'-'+('0'+out.getDate()).slice(-2);
    var early=Math.max(0, Math.round(r.daysLeft-r.runoutDays));
    return '<div class="runway bad">\u26a0 At '+money(r.rate)+'/day the remaining '+money(r.remaining)
      + ' runs out around <b>'+esc(labelDate(iso))+'</b> \u2014 about '+early+' day'+(early===1?'':'s')+' before month end.</div>';
  }
  return '<div class="runway ok">At '+money(r.rate)+'/day the remaining '+money(r.remaining)+' lasts through month end.</div>';

/* ---- burn rate: will the budget run out before the month does? ---- */
var BURN_MIN_BUDGET=500;  // ignore trivially small budgets
var BURN_WARN_DAYS=2;     // runs dry this many days early → warning
var BURN_CRIT_DAYS=5;     //  … → critical
function burnInfo(a,d){
  var c=ctx();
  if(!c.isLive) return null;
  if(accountDiscipline(a)==='fluid') return null;   // fluid budgets: over/under isn't flagged as an issue
  if(c.elapsed<5) return null;                       // early-cycle projections are noise (no burn alerts before day 5)
  var r=recentPace(a,d);
  if(!r.ok || r.daysLeft<2 || r.days<3 || !(r.budget>=BURN_MIN_BUDGET)) return null;
  if(r.remaining<=0){
    return { level:'critical', early:r.daysLeft, tag:'over budget',
      text:'Budget already spent — '+money(Math.abs(r.remaining))+' over with '+r.daysLeft+' day'+(r.daysLeft===1?'':'s')+' still to go' };
  }
  // Day-of-week aware runout: walk the weekday-weighted forecast of the
  // remaining days and see when the money actually runs dry — so a weekday burn
  // rate isn't extrapolated flat across a weekend tail (the false-Critical bug).
  var dp = d.dow || dowProject(a.client, d.mtd), iso, early, rateTxt;
  if(dp){
    var rem=r.remaining, hit=-1;
    for(var i=0;i<dp.fc.length;i++){ rem-=dp.fc[i].f; if(rem<=0){ hit=i; break; } }
    if(hit<0) return null;                            // budget lasts through month end
    iso=dp.fc[hit].date; early=dp.fc.length-1-hit; rateTxt='~'+money(dp.baseline)+'/weekday';
  } else {
    if(r.runoutDays==null || r.runoutDays>=r.daysLeft) return null;   // fallback: flat recent-rate runout
    early=r.daysLeft-r.runoutDays;
    var out=new Date(); out.setDate(out.getDate()+Math.max(0,Math.round(r.runoutDays)));
    iso=out.getFullYear()+'-'+('0'+(out.getMonth()+1)).slice(-2)+'-'+('0'+out.getDate()).slice(-2);
    rateTxt=money(r.rate)+'/day';
  }
  var lvl = early>=BURN_CRIT_DAYS ? 'critical' : (early>=BURN_WARN_DAYS ? 'warning' : null);
  if(!lvl) return null;
  var e=Math.round(early);
  return { level:lvl, early:e, date:iso, tag:'out '+labelDate(iso),
    text:'Burning '+rateTxt+' — the '+money(r.remaining)+' left runs out around '+labelDate(iso)+' ('+e+' day'+(e===1?'':'s')+' early)' };
}
// Alerts only apply to accounts we're actively managing — paused/unlabeled
// and manually hidden accounts never count as an issue or a win.
function anyLabelsInUse(){ for(var i=0;i<state.accounts.length;i++){ if(state.accounts[i].labels.length) return true; } return false; }
function alertEligible(a){ if(a.hidden) return false; return anyLabelsInUse() ? isActive(a) : true; }
function alertFor(a){
  var res={flagged:false, level:'none', dismissed:false, positive:false, reasons:[]};
  if(!alertEligible(a)) return res;
  var u=state.dismiss[a.client]; if(u && u>=todayIso()) res.dismissed=true;
  var ec=isEcomm(a);
  var map={}; accountDaily(a.client).forEach(function(p){ if(String(p.date)<todayIso()) map[p.date]=p; });
  var dates=Object.keys(map).sort();
  if(dates.length){
    METRICS.forEach(function(m){
      if(m.k==='rev' && !ec) return;
      var w7=windowSignal(map,dates,m.k,7), w3=windowSignal(map,dates,m.k,3);
      if(!w7 || w7.mu < m.minDay*7) return;
      var label=(m.k==='conv')?(ec?'Conversions':'Leads'):m.label;
      var severe = w3 && w3.mu>=m.critDay*3 && w3.z<=-Z_CRIT && w3.pct<=-PCT_CRIT && w7.z<=-Z_WARN; // 3d + 7d confirmation
      if(m.k==='spend'){
        if(severe) res.reasons.push({label:label,dir:'down',critical:true,base:w7.mu,val:w7.recent,pct:w7.pct}); // pullbacks aren't flagged; only collapse
      } else if(w7.z<=-Z_WARN && w7.pct<=-PCT_WARN){
        res.reasons.push({label:label,dir:'down',critical:!!severe,base:w7.mu,val:w7.recent,pct:w7.pct});
      } else if(w7.z>=Z_WARN && w7.pct>=PCT_WARN){
        res.reasons.push({label:label,dir:'up',critical:false,base:w7.mu,val:w7.recent,pct:w7.pct});
      }
    });
  }
  // Spend collapse: recent few days vs the prior ~2 weeks. Percentage + floor
  // based, so it catches smaller accounts the z-score check above skips (e.g.
  // an account that was ~$16/day and basically stopped spending).
  (function(){
    if(res.reasons.some(function(x){return x.label==='Spend'&&x.dir==='down';})) return; // don't double-flag
    if(dates.length<10) return;           // need enough history for a stable baseline
    var ref=state.searchMaxDate; if(!ref) return;
    // Spend by CALENDAR day (missing export row = $0), measured against the freshest
    // completed date across the portfolio. A 7-DAY recent window is day-of-week
    // BALANCED (a full week always spans the weekend), so an account that simply
    // spends less on weekends doesn't read as a collapse — only a genuine week-long
    // stall does. Floor + 65% threshold keep low-volume, erratic accounts (whose
    // day-to-day swings aren't real signal) from cluttering the list.
    var cm={}; dates.forEach(function(dk){ cm[dk]=(map[dk].spend||0); });
    function wav(endIso,n){ var s=0; for(var i=0;i<n;i++){ s+=(cm[isoAdd(endIso,-i)]||0); } return s/n; }
    var r=wav(ref,7), bs=wav(isoAdd(ref,-7),14);
    if(!(bs>=40)) return;                 // baseline must be a real spender, not low-volume noise
    if(r > bs*0.35) return;               // must be a genuine collapse (65%+ below the trailing baseline)
    res.reasons.push({label:'Spend',dir:'down',critical:(r<=bs*0.15),base:bs,val:r,pct:(r-bs)/bs});
  })();
  var down=res.reasons.filter(function(x){return x.dir==='down';});
  var up=res.reasons.filter(function(x){return x.dir==='up';});
  res.burn = burnInfo(a, derive(a));
  var isCrit = down.some(function(x){return x.critical;}) || (res.burn && res.burn.level==='critical');
  var isWarn = down.length>0 || (res.burn && res.burn.level==='warning');
  var raw = isCrit ? 'critical' : (isWarn ? 'warning' : (up.length ? 'positive' : 'none'));
  res.level = res.dismissed ? 'none' : raw;
  if(res.dismissed) res.burn = null;
  res.flagged = (res.level==='critical'||res.level==='warning');
  res.positive = (res.level==='positive');
  return res;
}
function alRank(a){ var l=alertFor(a); return l.level==='critical'?3:(l.level==='warning'?2:(l.level==='positive'?1:0)); }
function alTip(al){
  var parts=[];
  if(al.burn) parts.push(al.burn.text);
  al.reasons.forEach(function(x){ parts.push(x.label+' '+(x.dir==='up'?'+':'')+Math.round(x.pct*100)+'%'+(x.critical?' (critical)':'')); });
  return parts.join(' · ');
}
function dismissClient(a, days){

function accountDaily(client){ return state.dailyByClient[client]||[]; }
var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function labelDate(iso){ var p=iso.split('-'); return MONTHS[(+p[1]-1)]+' '+(+p[2]); }
function niceMax(v){ if(v<=0)return 1; var p=Math.pow(10,Math.floor(Math.log(v)/Math.LN10)); var n=v/p; var m=n<=1?1:(n<=2?2:(n<=5?5:10)); return m*p; }
function makeXTicks(rows){ var n=rows.length,k=Math.min(5,n),t=[]; for(var i=0;i<k;i++){ var idx=Math.round(i*(n-1)/((k-1)||1)); t.push({x:rows[idx].dayNum,label:labelDate(rows[idx].date)}); } return t; }
function chartSVG(o){
  var w=480,h=190,padL=46,padR=12,padT=12,padB=26,iw=w-padL-padR,ih=h-padT-padB;
  var xMin=o.xMin,xMax=o.xMax,yMax=o.yMax||1;
  function X(x){ return padL+(xMax===xMin?0:(x-xMin)/(xMax-xMin))*iw; }
  function Y(y){ return padT+ih-(y/yMax)*ih; }
  var g='';
  for(var i=0;i<=4;i++){ var yv=yMax*i/4,py=Y(yv);
    g+='<line x1="'+padL+'" y1="'+py.toFixed(1)+'" x2="'+(w-padR)+'" y2="'+py.toFixed(1)+'" stroke="#EDF0F3"/>';
    g+='<text x="'+(padL-6)+'" y="'+(py+3).toFixed(1)+'" text-anchor="end" font-size="9" fill="#93A0AD">'+o.yFmt(yv)+'</text>'; }
  (o.xTicks||[]).forEach(function(t){ g+='<text x="'+X(t.x).toFixed(1)+'" y="'+(h-8)+'" text-anchor="middle" font-size="9" fill="#93A0AD">'+t.label+'</text>'; });
  if(o.bars && o.bars.pts.length){
    var n=o.bars.pts.length;
    var slot=(xMax===xMin)?iw:iw/(n>1?(n-1):1);
    var bw=Math.max(1.5,Math.min(14,slot*0.62));
    o.bars.pts.forEach(function(p){
      var v=p[1]||0, py=Y(v), bh=Math.max(0,padT+ih-py);
      var col=(o.bars.colorFor?o.bars.colorFor(p):o.bars.color)||'#4A5568';
      g+='<rect x="'+(X(p[0])-bw/2).toFixed(1)+'" y="'+py.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="1.5" fill="'+col+'"/>';
    });
  }
  (o.series||[]).forEach(function(s){ if(!s.pts.length)return;
    var dp=s.pts.map(function(p,i){return (i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1);}).join(' ');
    g+='<path d="'+dp+'" fill="none" stroke="'+s.color+'" stroke-width="2"'+(s.dash?' stroke-dasharray="4 3"':'')+' stroke-linejoin="round" stroke-linecap="round"/>'; });
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block">'+g+'</svg>';
}
function resolveBudget(client, monthKey){
  var ex = state.budgets[monthKey] && state.budgets[monthKey][client];
  if(ex) return ex;
  var k=monthKey;
  for(var i=0;i<12;i++){ k=shiftKey(k,-1); var b=state.budgets[k]&&state.budgets[k][client]; if(b) return b; }
  return {mode:'manual',amount:0};
}
function makeXTicksIdx(rows){ var n=rows.length,k=Math.min(6,n),t=[]; for(var i=0;i<k;i++){ var idx=Math.round(i*(n-1)/((k-1)||1)); t.push({x:idx,label:labelDate(rows[idx].date)}); } return t; }
function detailHTML(a,d){
  var days=state.detailDays||30;
  // Calendar-fill: the feed omits $0-spend days, so a drop to $0 (or an account
  // that stopped spending) is otherwise invisible. Build a date->row map and walk
  // a CONTINUOUS calendar through the freshest completed day across the portfolio
  // (≈ yesterday); missing days render as $0.
  var rich={}, dmin='';
  accountDaily(a.client).forEach(function(p){ var k=String(p.date); if(k<todayIso()){ rich[k]=p; if(!dmin||k<dmin) dmin=k; } });
  if(!dmin) return '';
  var endRef = (state.searchMaxDate && state.searchMaxDate>=dmin) ? state.searchMaxDate : dmin;
  var wStart = isoAdd(endRef, -(days-1)); if(wStart<dmin) wStart=dmin;

  // Expected curve + each day's target follow the DAY-OF-WEEK weighted shape
  // (weekend days get a low target, weekdays a high one) rather than a flat
  // budget÷days ramp, so weekend bars aren't painted "under" and the expected
  // line tracks the real one. Falls back to flat for LOW-confidence accounts.
  var _expCache={};
  function _expInc(mk, amt, dayNum){
    if(!(amt>0)) return 0;
    var ck=mk+'|'+amt, e=_expCache[ck]||(_expCache[ck]=dowExpected(a.client, mk, amt));
    return e.at(dayNum)-e.at(dayNum-1);
  }
  var cum=0, cexp=0, clin=0, rows=[], _iso=wStart, _i=0;
  while(_iso<=endRef){
    var p=rich[_iso]||{date:_iso,spend:0,conv:0,clicks:0,impr:0,rev:0};
    cum+=p.spend;
    var mk=_iso.slice(0,7), b=resolveBudget(a.client,mk);
    var amt=(b.mode==='lastMonth')?d.lastMoTotal:b.amount;
    var dayNum=+_iso.slice(8,10), flat=(amt>0?amt/daysInMonthOf(mk):0), tgt=_expInc(mk,amt,dayNum);
    cexp += tgt; clin += flat;
    rows.push({ i:_i, date:_iso, spend:p.spend, cum:cum, expected:cexp, expectedLinear:clin, target:tgt, conv:p.conv,
             cpa:p.conv>0?p.spend/p.conv:null, rev:p.rev, roas:(p.rev>0&&p.spend>0)?p.rev/p.spend:null,
             clicks:p.clicks, impr:p.impr });
    _iso=isoAdd(_iso,1); _i++;
  }
  var n=rows.length, last=rows[n-1];
  var hasRev=isEcomm(a);
  var moneyY=function(v){return money(v,true);}, xFmt=function(v){return v.toFixed(1)+'x';};
  var xTicks=makeXTicksIdx(rows);
  function maxOf(key){ var vals=rows.map(function(r){return r[key];}).filter(function(v){return v!=null;}); return niceMax(vals.length?Math.max.apply(null,vals):1); }
  function px(key){ return rows.map(function(r){return [r.i,r[key]];}); }
  function pxf(key){ return rows.filter(function(r){return r[key]!=null;}).map(function(r){return [r.i,r[key]];}); }

  var yDaily=niceMax(Math.max.apply(null,rows.map(function(r){return Math.max(r.spend,r.target);}).concat([1])));
  var dailyChart=chartSVG({xMin:0,xMax:n-1,yMax:yDaily,yFmt:moneyY,xTicks:xTicks,
    bars:{pts:px('spend'),colorFor:function(p){ var r=rows[p[0]]; if(!r.target) return '#9AA6B4';
      return r.spend>r.target*1.15?'#C13B2E':(r.spend<r.target*0.85?'#D9A63C':'#4A5568'); }},
    series:[{pts:px('target'),color:'#3A4FBF',dash:true}]});
  var avgSpend=rows.reduce(function(s,r){return s+r.spend;},0)/n;
  var avgTarget=rows.reduce(function(s,r){return s+r.target;},0)/n;

  var cumChart=chartSVG({xMin:0,xMax:n-1,yMax:niceMax(Math.max(last.cum,last.expected,1)),yFmt:moneyY,xTicks:xTicks,
    series:[{pts:px('cum'),color:'#4A5568'},{pts:px('expected'),color:'#3A4FBF',dash:true}]});
  var cpaChart=chartSVG({xMin:0,xMax:n-1,yMax:maxOf('cpa'),yFmt:moneyY,xTicks:xTicks,series:[{pts:pxf('cpa'),color:'#42506A'}]});

  var charts=''
    + '<div class="chartcard"><div class="ch-title">Daily spend vs target</div>'+dailyChart
      + '<div class="legend"><span class="lg"><i style="background:#4A5568"></i>On target</span><span class="lg"><i style="background:#D9A63C"></i>Under</span>'
      + '<span class="lg"><i style="background:#C13B2E"></i>Over</span><span class="lg"><i style="background:#3A4FBF"></i>Target/day</span></div>'
      + (avgTarget>0?('<div class="chnote">Avg '+money(avgSpend)+'/day vs '+money(avgTarget)+' target</div>'):'<div class="chnote">Set a budget to see the daily target</div>')
      + '</div>'
    + '<div class="chartcard"><div class="ch-title">Cumulative spend — actual vs expected</div>'+cumChart+'<div class="legend"><span class="lg"><i style="background:#4A5568"></i>Actual</span><span class="lg"><i style="background:#3A4FBF"></i>Expected</span></div></div>'
    + '<div class="chartcard"><div class="ch-title">Cost / conv (daily)</div>'+cpaChart+'</div>';
  if(hasRev){
    var revChart=chartSVG({xMin:0,xMax:n-1,yMax:maxOf('rev'),yFmt:moneyY,xTicks:xTicks,series:[{pts:px('rev'),color:'#1B8A5A'}]});
    var roasChart=chartSVG({xMin:0,xMax:n-1,yMax:maxOf('roas'),yFmt:xFmt,xTicks:xTicks,series:[{pts:pxf('roas'),color:'#1B8A5A'}]});
    charts+='<div class="chartcard"><div class="ch-title">Revenue (daily)</div>'+revChart+'</div>'
          + '<div class="chartcard"><div class="ch-title">ROAS (daily)</div>'+roasChart+'</div>';
  }

  var rangebar='<div class="rangebar"><span class="rl">Last</span><div class="segment sm">'
    + [30,60,90].map(function(dd){return '<button class="'+(days===dd?'on':'')+'" data-act="range" data-days="'+dd+'">'+dd+'d</button>';}).join('')
    + '</div><span class="rangecount">'+n+' days · '+labelDate(rows[0].date)+' – '+labelDate(last.date)+'</span></div>';

  var tbl='<table class="bd"><thead><tr><th>Day</th><th class="r">Daily spend</th><th class="r">Cumulative</th><th class="r">Expected</th><th class="r">Conv.</th><th class="r">CPA</th>'
        + (hasRev?'<th class="r">Revenue</th><th class="r">ROAS</th>':'')
        + '<th class="r">Clicks</th><th class="r">Impr.</th></tr></thead><tbody>';
  rows.slice().reverse().forEach(function(r){ tbl+='<tr><td>'+labelDate(r.date)+'</td><td class="r">'+money(r.spend)+'</td><td class="r">'+money(r.cum)+'</td><td class="r">'+(r.expected?money(r.expected):'—')+'</td><td class="r">'+intf(r.conv)+'</td><td class="r">'+(r.cpa==null?'—':money(r.cpa))+'</td>'
    + (hasRev?('<td class="r">'+(r.rev>0?money(r.rev):'—')+'</td><td class="r">'+(r.roas==null?'—':xFmt(r.roas))+'</td>'):'')
    + '<td class="r">'+intf(r.clicks)+'</td><td class="r">'+intf(r.impr)+'</td></tr>'; });
  tbl+='</tbody></table>';

  return '<div class="detail">'+rangebar+'<div class="charts">'+charts+'</div>'
    + '<div class="ch-title" style="margin:16px 0 6px">Daily breakdown</div><div class="bd-wrap">'+tbl+'</div></div>';
}

function updateComputed(client){

  var vr=row.querySelector('.cell-var');

document.addEventListener('click', function(e){

  var act=el.getAttribute('data-act'), client=el.getAttribute('data-client');
  if(act==='prev'){ state.viewMonth=shiftKey(state.viewMonth,-1); render(); }
  else if(act==='next'){ state.viewMonth=shiftKey(state.viewMonth,1); render(); }
  else if(act==='today'){ state.viewMonth=state.liveKey; render(); }

  else if(act==='toggle-issues'){ state.filterIssues=!state.filterIssues; state.filterWins=false; render(); }
  else if(act==='toggle-wins'){ state.filterWins=!state.filterWins; state.filterIssues=false; render(); }
  else if(act==='toggle-hidden'){ state.showHidden=!state.showHidden; render(); }
  else if(act==='notif-toggle'){ state.notifOpen=(state.notifOpen===false); render(); }
  else if(act==='notif-open'){
    state.open[client]=true; state.scrollTo=client; render();
  }
  else if(act==='rename'){ var ar=accountByClient(client); if(ar) renameClient(ar); }
  else if(act==='type-lead'){ var tl=accountByClient(client); if(tl) setTypeClient(tl,'leadgen'); }
  else if(act==='type-ecom'){ var te=accountByClient(client); if(te) setTypeClient(te,'ecomm'); }
  else if(act==='disc-fluid'){ var df=accountByClient(client); if(df) setDisciplineClient(df, accountDiscipline(df)==='fluid'?'':'fluid'); }
  else if(act==='disc-strict'){ var ds=accountByClient(client); if(ds) setDisciplineClient(ds, accountDiscipline(ds)==='strict'?'':'strict'); }
  else if(act==='hide'){ var ah=accountByClient(client); if(ah) hideClient(ah,true); }
  else if(act==='unhide'){ var au=accountByClient(client); if(au) hideClient(au,false); }

  else if(act==='slack-send'){ sendSlack(); }
  else if(act==='slack-cancel'){ if(el.classList.contains('modal-overlay') && e.target!==el) return; closeSlack(); }
  else if(act==='sort'){ toggleSort(el.getAttribute('data-key')); render(); }
  else if(act==='group'){ groupSelected(); }
  else if(act==='bulk-lm'){ bulkLastMonth(); }
  else if(act==='ungroup'){ ungroupSelected(); }
  else if(act==='clearsel'){ state.selected={}; render(); }

document.addEventListener('input', function(e){
  if(e.target.classList.contains('budget-input')){
    var el=e.target, client=el.getAttribute('data-client');
    var digits=el.value.replace(/[^0-9]/g,'');
    var val=digits===''?0:parseInt(digits,10);
    var digitsBefore=el.value.slice(0,el.selectionStart).replace(/[^0-9]/g,'').length;
    var formatted=digits===''?'':val.toLocaleString('en-US');
    el.value=formatted;
    var pos=0,seen=0; while(pos<formatted.length&&seen<digitsBefore){ if(formatted.charCodeAt(pos)>=48&&formatted.charCodeAt(pos)<=57) seen++; pos++; }
    try{ el.setSelectionRange(pos,pos); }catch(err){}
    setBudget(client,{mode:'manual',amount:val});
    updateComputed(client);
  } else if(e.target.id==='day-input'){
    var v=e.target.value.replace(/[^0-9]/g,'');
    state.elapsedOverride = v===''?null:parseInt(v,10);
    saveElapsed(state.elapsedOverride);
    visibleAccounts().list.forEach(function(a){ updateComputed(a.client); });
  } else if(e.target.id==='acct-filter'){
    state.filter=e.target.value;
    var pos=e.target.selectionStart;
    render();
    var el=document.getElementById('acct-filter');
    if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(err){} }
  }
});

function copyPrev(){
  var prev=shiftKey(state.viewMonth,-1);
  if(!state.budgets[prev]){ alert('No budgets saved for '+monthLabel(prev)+' to copy.'); return; }
  if(!confirm('Copy every budget from '+monthLabel(prev)+' into '+monthLabel(state.viewMonth)+'?')) return;
  var src=state.budgets[prev];
  Object.keys(src).forEach(function(client){ setBudget(client, {mode:src[client].mode, amount:src[client].amount}); });
  render();
}
